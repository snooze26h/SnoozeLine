name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.os }} artifact
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/snoozeline dist/snoozeline

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/snoozeline.exe dist/snoozeline.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoozeline-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
